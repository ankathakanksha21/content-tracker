# Supabase pauses free projects after about a week with too little activity.
# This reads one row every 3 days so the tracker stays awake even if nobody visits.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the tracker once
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseAnonKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js isn't filled in yet, nothing to ping."; exit 0; fi
          curl -fsS "$URL/rest/v1/tracker_config?select=id&limit=1" -H "apikey: $KEY" > /dev/null
          echo "Pinged $URL"
